[project]
name = "liehu"
version = "0.1.0"
description = "SilverFoxHunter 银狐猎手 - 银狐仿冒下载链威胁情报追踪系统"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.140.0",
    "httpx>=0.28.1",
    "olefile>=0.47",
    "pefile>=2024.8.26",
    "uvicorn[standard]>=0.51.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liehu"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
